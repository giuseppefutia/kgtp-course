<style>
#__UID__{font-family:Arial,Helvetica,sans-serif;color:#263238;background:#FFFFFF;border:1px solid #CFD8DC;border-radius:10px;padding:16px 18px;max-width:740px;box-sizing:border-box;line-height:1.4}
#__UID__ *{box-sizing:border-box}
#__UID__ .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
#__UID__ .bar span{font-size:13px;color:#607D8B;margin-right:2px}
#__UID__ .gap{width:14px}
#__UID__ button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid #B7B7B7;background:#FFFFFF;color:#263238;border-radius:6px;cursor:pointer}
#__UID__ button:hover{background:#ECEFF1}
#__UID__ button.sel{border-color:#0091EA;color:#0053A3;background:#ECEFF1;font-weight:bold}
#__UID__ button:focus-visible{outline:2px solid #0091EA;outline-offset:2px}
#__UID__ .out{font-size:14px;line-height:1.55;min-height:3.4em;background:#ECEFF1;color:#263238;border-radius:6px;padding:9px 12px;margin:0 0 14px}
#__UID__ .cap{font-size:12px;font-weight:bold;color:#607D8B;margin:0 0 5px}
#__UID__ .c{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 6px;border:1px solid #CFD8DC;border-radius:5px;font-size:13px;background:#FFFFFF;color:#263238}
#__UID__ .c.e{color:#B7B7B7;border-color:#ECEFF1;background:transparent}
#__UID__ .c.on{background:#ACDBF8;color:#0053A3;border-color:#0091EA}
#__UID__ .c.hot{background:#0091EA;color:#FFFFFF;border-color:#0091EA;font-weight:bold}
#__UID__ .c.b{box-shadow:0 0 0 2px #0091EA inset;color:#0053A3}
#__UID__ .h{display:inline-flex;justify-content:center;min-width:40px;font-size:11px;color:#9E9E9E}
#__UID__ .rl{display:inline-block;width:62px;font-size:12px;color:#607D8B}
#__UID__ .r{display:flex;gap:4px;align-items:center;margin:0 0 4px}
@media (prefers-reduced-motion:no-preference){#__UID__ .c{transition:background .15s,border-color .15s}}
#__UID__ .c.sk{box-shadow:0 0 0 2px #FF9900 inset;color:#263238}
</style>
<div id="__UID__">
<div class="bar"><span>Start from</span>
<button data-i="c1">c1</button><button data-i="c2">c2</button><button data-i="c3">c3</button>
<span class="gap"></span><button data-m="1">Hop 1</button><button data-m="2">Hop 2</button>
<span class="gap"></span><span>Store</span><button data-c="0">before compaction</button><button data-c="1">after compaction</button></div>
<p class="out" aria-live="polite"></p>
<svg viewBox="0 20 680 310" width="100%" style="max-width:600px;display:block;margin:0 auto 14px" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Three contracts, four organisations, three licences, joined by HAS_VENDOR and ORG_HAS_LICENSE triples"><defs><marker id="__UID__g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B7B7B7"/></marker><marker id="__UID__b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0091EA"/></marker></defs><text x="100" y="40" font-size="14" font-weight="bold" fill="#0091EA" text-anchor="middle">contracts</text><text x="340" y="40" font-size="14" font-weight="bold" fill="#0091EA" text-anchor="middle">organisations</text><text x="580" y="40" font-size="14" font-weight="bold" fill="#0091EA" text-anchor="middle">licences</text><text x="220" y="62" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">HAS_VENDOR</text><text x="460" y="62" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">ORG_HAS_LICENSE</text><line data-e="201" x1="128.0" y1="116.5" x2="311.0" y2="93.6" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="202" x1="128.0" y1="203.5" x2="311.0" y2="226.4" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="203" x1="127.8" y1="266.1" x2="311.3" y2="174.3" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="204" x1="128.0" y1="282.3" x2="311.0" y2="297.6" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="301" x1="368.0" y1="93.5" x2="551.0" y2="116.4" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="302" x1="363.0" y1="108.2" x2="556.2" y2="261.1" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="303" x1="368.0" y1="164.7" x2="551.0" y2="195.2" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="304" x1="368.0" y1="297.7" x2="551.0" y2="282.4" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><g data-v="c1"><rect x="74.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c1</text></g><g data-v="c2"><rect x="74.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c2</text></g><g data-v="c3"><rect x="74.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c3</text></g><g data-v="o1"><rect x="314.0" y="73.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="95" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o1</text></g><g data-v="o2"><rect x="314.0" y="143.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="165" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o2</text></g><g data-v="o3"><rect x="314.0" y="213.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="235" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o3</text></g><g data-v="o4"><rect x="314.0" y="283.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="305" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o4</text></g><g data-v="l1"><rect x="554.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l1</text></g><g data-v="l2"><rect x="554.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l2</text></g><g data-v="l3"><rect x="554.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l3</text></g></svg>
<p class="cap">Sorted runs, in gspo key order (every key starts with the graph, kgtp, omitted here)</p>
<div class="runs" style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start"></div>
</div>
<script>
(function(){
const R=document.getElementById('__UID__'), $=s=>R.querySelector(s), $$=s=>R.querySelectorAll(s);
const T=[['c1','HAS_VENDOR','o1',201],['c2','HAS_VENDOR','o3',202],['c3','HAS_VENDOR','o2',203],['c3','HAS_VENDOR','o4',204],
 ['o1','ORG_HAS_LICENSE','l1',301],['o1','ORG_HAS_LICENSE','l3',302],['o2','ORG_HAS_LICENSE','l2',303],['o4','ORG_HAS_LICENSE','l3',304]];
function hl(edges,reached,start){
 R.querySelectorAll('line[data-e]').forEach(l=>{l.setAttribute('stroke','#B7B7B7');l.setAttribute('stroke-width','1.5');l.setAttribute('marker-end','url(#__UID__g)')});
 R.querySelectorAll('g[data-v] rect').forEach(r=>r.setAttribute('fill','#CFD8DC'));R.querySelectorAll('g[data-v] text').forEach(t=>t.setAttribute('fill','#263238'));
 edges.forEach(e=>{const l=R.querySelector('line[data-e="'+e+'"]');if(!l)return;l.setAttribute('stroke','#0091EA');l.setAttribute('stroke-width','2.5');l.setAttribute('marker-end','url(#__UID__b)');});
 const paint=(v,c)=>{const g=R.querySelector('g[data-v="'+v+'"]');if(!g)return;g.querySelector('rect').setAttribute('fill',c);g.querySelector('text').setAttribute('fill','#FFFFFF');};
 reached.forEach(v=>paint(v,'#0091EA'));start.forEach(v=>paint(v,'#0053A3'));}
const POS={s:0,p:1,o:2,g:3};
function sortBy(order,rows){return rows.slice().sort((a,b)=>{for(const k of order){const x=a[POS[k]],y=b[POS[k]];if(x<y)return -1;if(x>y)return 1;}return 0;});}
function range(order,rows,pat){const pre=[];for(const k of order){if(pat[k]===undefined)break;pre.push(pat[k]);}
 const m=[];rows.forEach((r,i)=>{if(pre.every((v,j)=>r[POS[order[j]]]===v))m.push(i);});return {pre,m};}
function table(order,rows,m,cls,starts){starts=starts||[m[0]];const W={s:44,p:132,o:44,g:52};
 let h='<div class="r"><span class="rl" style="width:40px"></span>'+order.map(k=>'<span class="h" style="min-width:'+W[k]+'px">'+k.toUpperCase()+'</span>').join('')+'</div>';
 rows.forEach((r,i)=>{const on=m.includes(i);h+='<div class="r"><span class="rl" style="width:40px;font-size:11px;color:#0091EA;font-weight:bold">'+(on&&starts.includes(i)?'seek ▶':'')+'</span>'+order.map(k=>'<span class="c'+(on?' '+cls:'')+'" style="min-width:'+W[k]+'px;font-size:12px">'+r[POS[k]]+'</span>').join('')+'</div>';});return h;}
const byId={};T.forEach(t=>byId[t[3]]=t);
const q=id=>{const t=byId[id];return [t[0],t[1],t[2],'kgtp',id];};
const ORD=['g','s','p','o'];
const STATES=[
 [{name:'memtable',ids:[204,304]},{name:'sst 2 · newest file',ids:[202,203,303]},{name:'sst 1 · oldest file',ids:[201,203,301,302]}],
 [{name:'memtable',ids:[]},{name:'sst · one file after compaction',ids:[201,202,203,204,301,302,303,304]}]];
let C='c3',M=1,K=0;
const key=r=>r.slice(0,4).join('|');
function render(){
 $$('button[data-i]').forEach(b=>b.classList.toggle('sel',b.dataset.i===C));$$('button[data-m]').forEach(b=>b.classList.toggle('sel',+b.dataset.m===M));$$('button[data-c]').forEach(b=>b.classList.toggle('sel',+b.dataset.c===K));
 const runs=STATES[K].map(r=>({name:r.name,rows:sortBy(ORD,r.ids.map(q)),hot:[],sk:[],notes:[]}));
 let seeks=0,shadow=0;const edges=[],reached=[];
 function hop(pat){const seen=new Set(),found=[];
  runs.forEach(run=>{seeks++;const r=range(ORD,run.rows,pat);
   run.notes.push('('+[pat.s,pat.p].join(' ')+') → '+(r.m.length?r.m.length+' row'+(r.m.length>1?'s':''):'empty'));
   r.m.forEach(i=>{const k=key(run.rows[i]);if(seen.has(k)){run.sk.push(i);shadow++;}else{seen.add(k);run.hot.push(i);found.push(run.rows[i]);}});});
  found.sort((a,b)=>a[2]<b[2]?-1:1);return found;}
 const f1=hop({g:'kgtp',s:C,p:'HAS_VENDOR'});f1.forEach(r=>{edges.push(String(r[4]));reached.push(r[2]);});
 let txt='',res=f1.map(r=>r[2]);
 if(M===2){const ls=[];f1.forEach(r=>hop({g:'kgtp',s:r[2],p:'ORG_HAS_LICENSE'}).forEach(x=>{edges.push(String(x[4]));if(!reached.includes(x[2]))reached.push(x[2]);if(!ls.includes(x[2]))ls.push(x[2]);}));res=ls;}
 $('.runs').innerHTML=runs.map(run=>{const W={s:44,p:124,o:44};
  let h='<div style="border:1px solid #CFD8DC;border-radius:6px;padding:6px 8px"><p class="cap" style="margin-bottom:3px">'+run.name+'</p><p class="h" style="justify-content:flex-start;margin:0 0 5px;color:#0091EA;font-weight:bold">seek ▶ '+run.notes.join('; ')+'</p>';
  h+='<div class="r">'+['s','p','o'].map(k=>'<span class="h" style="min-width:'+W[k]+'px">'+k.toUpperCase()+'</span>').join('')+'</div>';
  if(!run.rows.length)h+='<span class="h" style="padding:4px 0">empty</span>';
  run.rows.forEach((r,i)=>{const c=run.hot.includes(i)?' hot':run.sk.includes(i)?' sk':'';h+='<div class="r">'+['s','p','o'].map(k=>'<span class="c'+c+'" style="min-width:'+W[k]+'px;font-size:12px">'+r[POS[k]]+'</span>').join('')+'</div>';});
  return h+'</div>';}).join('');
 hl(edges,reached,[C]);
 const runsN=runs.length,hops=M===1?1:1+f1.length;
 txt=(M===1?'Hop 1: one prefix lookup':'Hop 1 and hop 2: '+hops+' prefix lookups, one for '+C+' and one per organisation found')+', each a seek in every one of the '+runsN+' sorted runs — '+seeks+' seeks — merged on the fly → '+(res.join(', ')||(M===1?'nothing':'no licence'))+'.';
 txt+=shadow?' The same key turned up in two files: the newer copy wins, the older one (orange) was read for nothing.':'';
 txt+=K===0?' Compact the store and the same hop costs fewer seeks.':' Only the memtable and one file are left, so each lookup costs two seeks — and the memtable seek is in memory.';
 $('.out').textContent=txt;}
R.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.i){C=b.dataset.i;}else if(b.dataset.m){M=+b.dataset.m;}else if(b.dataset.c!==undefined){K=+b.dataset.c;}render();});
render();
})();
</script>
