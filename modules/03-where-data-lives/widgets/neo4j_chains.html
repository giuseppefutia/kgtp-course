<style>

" y2="261.1" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="303" x1="368.0" y1="164.7" x2="551.0" y2="195.2" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><line data-e="304" x1="368.0" y1="297.7" x2="551.0" y2="282.4" stroke="#B7B7B7" stroke-width="1.5" marker-end="url(#__UID__g)"/><g data-t="201"><rect x="202.5" y="95.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="220.0" y="109.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">201</text></g><g data-t="202"><rect x="255.3" y="211.6" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="272.8" y="225.6" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">202</text></g><g data-t="203"><rect x="154.5" y="234.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="172.0" y="248.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">203</text></g><g data-t="204"><rect x="202.5" y="280.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="220.0" y="294.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">204</text></g><g data-t="301"><rect x="442.5" y="95.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="460.0" y="109.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">301</text></g><g data-t="302"><rect x="394.5" y="137.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="412.0" y="151.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">302</text></g><g data-t="303"><rect x="471.3" y="174.8" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="488.8" y="188.8" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">303</text></g><g data-t="304"><rect x="442.5" y="280.0" width="35" height="20" rx="4" fill="#FFFFFF" stroke="#B7B7B7" stroke-width="1"/><text x="460.0" y="294.0" font-size="11" font-weight="bold" fill="#607D8B" text-anchor="middle">304</text></g><g data-v="c1"><rect x="74.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c1</text></g><g data-v="c2"><rect x="74.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c2</text></g><g data-v="c3"><rect x="74.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c3</text></g><g data-v="o1"><rect x="314.0" y="73.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="95" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o1</text></g><g data-v="o2"><rect x="314.0" y="143.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="165" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o2</text></g><g data-v="o3"><rect x="314.0" y="213.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="235" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o3</text></g><g data-v="o4"><rect x="314.0" y="283.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="305" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o4</text></g><g data-v="l1"><rect x="554.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l1</text></g><g data-v="l2"><rect x="554.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l2</text></g><g data-v="l3"><rect x="554.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l3</text></g></svg>
<div style="display:flex;flex-wrap:wrap;gap:24px">
<div><p class="cap">Node store</p>
<div class="r"><span class="rl" style="width:28px"></span><span class="h" style="min-width:64px">first rel</span></div>
<div class="ns"></div></div>
<div><p class="cap">Relationship store</p>
<div class="r"><span class="rl" style="width:56px"></span><span class="h" style="min-width:128px">type</span><span class="h" style="min-width:64px">edge</span><span class="h" style="min-width:92px">next for start</span><span class="h" style="min-width:92px">next for end</span></div>
<div class="rs"></div></div>
</div>
</div>
<script>
(function(){
const R=document.getElementById('__UID__'), $=s=>R.querySelector(s), $$=s=>R.querySelectorAll(s);
const REL={201:['HAS_VENDOR','c1','o1'],202:['HAS_VENDOR','c2','o3'],203:['HAS_VENDOR','c3','o2'],204:['HAS_VENDOR','c3','o4'],
 301:['ORG_HAS_LICENSE','o1','l1'],302:['ORG_HAS_LICENSE','o1','l3'],303:['ORG_HAS_LICENSE','o2','l2'],304:['ORG_HAS_LICENSE','o4','l3']};
const NODES=['c1','c2','c3','o1','o2','o3','o4','l1','l2','l3'];
const chain={};NODES.forEach(n=>chain[n]=Object.keys(REL).map(Number).filter(r=>REL[r][1]===n||REL[r][2]===n).sort((a,b)=>a-b));
const first={},nxt={};NODES.forEach(n=>first[n]=chain[n].length?chain[n][0]:null);
Object.keys(REL).map(Number).forEach(r=>{const [t,a,b]=REL[r];const after=(n)=>{const c=chain[n],i=c.indexOf(r);return i<c.length-1?c[i+1]:null;};nxt[r]=[after(a),after(b)];});
const f=v=>v===null?'nil':v;
let h='';NODES.forEach(n=>h+='<div class="r"><span class="rl" style="width:28px">'+n+'</span><span class="c" style="min-width:64px" data-nf="'+n+'">'+f(first[n])+'</span></div>');$('.ns').innerHTML=h;h='';
Object.keys(REL).forEach(r=>{const [t,a,b]=REL[r];h+='<div class="r"><span class="rl" style="width:56px">rel '+r+'</span><span class="c" style="min-width:128px;font-size:11px" data-rt="'+r+'">'+t+'</span><span class="c" style="min-width:64px" data-re="'+r+'">'+a+' → '+b+'</span><span class="c" style="min-width:92px" data-rs="'+r+'">'+f(nxt[r][0])+'</span><span class="c" style="min-width:92px" data-rd="'+r+'">'+f(nxt[r][1])+'</span></div>';});$('.rs').innerHTML=h;
function walk(n,type,hop,out){out.push({t:'node',n,hop});let r=first[n];const found=[];
 while(r!==null){const [ty,a,b]=REL[r];const isS=a===n,m=isS?b:a,keep=(ty===type&&isS);const nx=isS?nxt[r][0]:nxt[r][1];
  if(keep)found.push(m);out.push({t:'rel',r,n,hop,side:isS?'start':'end',keep,m,ty,next:nx});r=nx;}
 out.push({t:'end',n,hop,found});return found;}
function plan(c){const s=[];const os=walk(c,'HAS_VENDOR',1,s);s.push({t:'hopdone',hop:1,res:os,c});const h1=s.length;
 const ls=[];os.forEach(o=>walk(o,'ORG_HAS_LICENSE',2,s).forEach(l=>{if(!ls.includes(l))ls.push(l)}));s.push({t:'hopdone',hop:2,res:ls,os});return {s,h1};}
let C='c3',S=1,P=plan(C),k=0;
function hl(){const kept=[],skip=[],reached=[];let cur=null;
 for(let i=0;i<=k;i++){const s=P.s[i];if(s.t==='rel'){(s.keep?kept:skip).push(s.r);if(s.keep&&!reached.includes(s.m))reached.push(s.m);}if(s.t==='node'||s.t==='rel')cur=s;}
 $$('line[data-e]').forEach(l=>{l.setAttribute('stroke','#B7B7B7');l.setAttribute('stroke-width','1.5');l.removeAttribute('stroke-dasharray');l.setAttribute('marker-end','url(#__UID__g)')});
 $$('g[data-t] rect').forEach(r=>{r.setAttribute('stroke','#B7B7B7');r.setAttribute('stroke-width','1')});$$('g[data-t] text').forEach(t=>t.setAttribute('fill','#607D8B'));
 $$('g[data-v] rect').forEach(r=>r.setAttribute('fill','#CFD8DC'));$$('g[data-v] text').forEach(t=>t.setAttribute('fill','#263238'));
 const edge=(e,col,dash)=>{const l=$('line[data-e="'+e+'"]');l.setAttribute('stroke',col);l.setAttribute('stroke-width','2.5');if(dash)l.setAttribute('stroke-dasharray','6 4');l.setAttribute('marker-end','url(#__UID__'+(col==='#0091EA'?'b':'o')+')');
  const g=$('g[data-t="'+e+'"]');g.querySelector('rect').setAttribute('stroke','#263238');g.querySelector('rect').setAttribute('stroke-width','1.5');g.querySelector('text').setAttribute('fill','#263238');};
 kept.forEach(e=>edge(e,'#0091EA'));if(cur&&cur.t==='rel'&&!cur.keep)edge(cur.r,'#FF9900',true);
 const paint=(v,c)=>{const g=$('g[data-v="'+v+'"]');g.querySelector('rect').setAttribute('fill',c);g.querySelector('text').setAttribute('fill','#FFFFFF');};
 reached.forEach(v=>paint(v,'#0091EA'));paint(C,'#0053A3');
 $$('.c').forEach(c=>c.classList.remove('on','hot','b','sk'));
 kept.forEach(r=>$('[data-re="'+r+'"]').classList.add('on'));skip.forEach(r=>['rt','re'].forEach(p=>$('[data-'+p+'="'+r+'"]').classList.add('sk')));
 if(cur){if(cur.t==='node')$('[data-nf="'+cur.n+'"]').classList.add('hot');else{['rt','re'].forEach(p=>$('[data-'+p+'="'+cur.r+'"]').classList.add('hot'));$('[data-'+(cur.side==='start'?'rs':'rd')+'="'+cur.r+'"]').classList.add('b');}}}
function text(s){const want=s.hop===1?'HAS_VENDOR':'ORG_HAS_LICENSE';
 if(s.t==='node')return 'Hop '+s.hop+' · '+s.n+'\u2019s record sits at a fixed offset, its position × width: arithmetic, no index. Its first rel is '+f(first[s.n])+'.';
 if(s.t==='rel')return 'Hop '+s.hop+' · rel '+s.r+' ('+s.ty+', '+REL[s.r][1]+' → '+REL[s.r][2]+'): '+s.n+' is its '+s.side+'. '+(s.keep?'Type and direction match, so '+s.m+' is a neighbour.':'The hop wants outgoing '+want+', so this record is read and skipped.')+' Next for '+s.side+' = '+f(s.next)+'.';
 if(s.t==='end')return 'Hop '+s.hop+' · nil: '+s.n+'\u2019s chain ends'+(s.found.length?', with '+s.found.join(', ')+'.':', with nothing kept.');
 if(s.hop===1)return 'Hop 1 done: the neighbours of '+s.c+' are '+(s.res.join(', ')||'none')+'. Every step was an address read from the record before.';
 const sk=P.s.filter(x=>x.t==='rel'&&!x.keep).map(x=>x.r);return 'Hop 2 done: licences '+(s.res.join(', ')||'none')+'.'+(sk.length?' Rel '+sk.join(', ')+(sk.length>1?' were':' was')+' read only to be skipped, outlined in orange: a chain holds every relationship of a node, whatever its type and direction.':'');}
function paintAll(){$$('button[data-i]').forEach(b=>b.classList.toggle('sel',b.dataset.i===C));$$('button[data-s]').forEach(b=>b.classList.toggle('sel',+b.dataset.s===S));
 hl();$('.out').textContent=text(P.s[k]);const last=S===1?P.h1-1:P.s.length-1;$('button[data-act="next"]').disabled=(k>=last);}
function reset(){k=S===1?0:P.h1;paintAll();}
R.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.i){C=b.dataset.i;P=plan(C);reset();}
 else if(b.dataset.s){S=+b.dataset.s;reset();}
 else if(b.dataset.act==='next'){const last=S===1?P.h1-1:P.s.length-1;if(k<last){k++;paintAll();}}
 else if(b.dataset.act==='reset')reset();});
reset();
})();
</script>
