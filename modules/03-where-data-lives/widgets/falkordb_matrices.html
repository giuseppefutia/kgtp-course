<style>
#__UID__{font-family:Arial,Helvetica,sans-serif;color:#263238;background:#FFFFFF;border:1px solid #CFD8DC;border-radius:10px;padding:16px 18px;max-width:740px;box-sizing:border-box;line-height:1.4}

#__UID__ .c.on{background:#ACDBF8;color:#0053A3;border-color:#0091EA}
#__UID__ .c.hot{background:#0091EA;color:#FFFFFF;border-color:#0091EA;font-weight:bold}
#__UID__ .c.b{box-shadow:0 0 0 2px #0091EA inset;color:#0053A3}
#__UID__ .h{display:inline-flex;justify-content:center;min-width:40px;font-size:11px;color:#9E9E9E}
#__UID__ .rl{display:inline-block;width:62px;font-size:12px;color:#607D8B}
#__UID__ .r{display:flex;gap:4px;align-items:center;margin:0 0 4px}
@media (prefers-reduced-motion:no-preference){#__UID__ .c{transition:background .15s,border-color .15s}}
#__UID__ .c.sk{box-shadow:0 0 0 2px #FF9900 inset;color:#263238}

anchor="middle">304</text></g><g data-v="c1"><rect x="74.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c1</text></g><g data-v="c2"><rect x="74.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c2</text></g><g data-v="c3"><rect x="74.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="100" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">c3</text></g><g data-v="o1"><rect x="314.0" y="73.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="95" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o1</text></g><g data-v="o2"><rect x="314.0" y="143.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="165" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o2</text></g><g data-v="o3"><rect x="314.0" y="213.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="235" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o3</text></g><g data-v="o4"><rect x="314.0" y="283.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="340" y="305" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">o4</text></g><g data-v="l1"><rect x="554.0" y="103.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="125" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l1</text></g><g data-v="l2"><rect x="554.0" y="183.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="205" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l2</text></g><g data-v="l3"><rect x="554.0" y="263.0" width="52" height="34" rx="6" fill="#CFD8DC" stroke="#FFFFFF"/><text x="580" y="285" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">l3</text></g></svg>
<div style="display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start">
<div><p class="cap">HAS_VENDOR · contract → organisation</p><div class="mA"></div></div>
<div><p class="cap">ORG_HAS_LICENSE · organisation → licence</p><div class="mB"></div></div>
</div>
</div>
<script>
(function(){
const R=document.getElementById('__UID__'), $=s=>R.querySelector(s), $$=s=>R.querySelectorAll(s);
const C=['c1','c2','c3'],O=['o1','o2','o3','o4'],L=['l1','l2','l3'];
const A=[[201,0,0,0],[0,0,202,0],[0,203,0,204]];
const B=[[301,0,302],[0,303,0],[0,0,0],[0,0,304]];
function grid(k,rows,cols,m){let h='<div class="r"><span class="rl" style="width:28px"></span>'+cols.map(c=>'<span class="h">'+c+'</span>').join('')+'</div>';
 rows.forEach((r,i)=>{h+='<div class="r"><span class="rl" style="width:28px">'+r+'</span>'+cols.map((_,j)=>{const v=m[i][j];return '<span class="c'+(v?'':' e')+'" data-'+k+'="'+i+'-'+j+'">'+(v||'·')+'</span>';}).join('')+'</div>';});
 return h;}
$('.mA').innerHTML=grid('a',C,O,A);$('.mB').innerHTML=grid('b',O,L,B);
function hl(edges,reached,start){
 R.querySelectorAll('line[data-e]').forEach(l=>{l.setAttribute('stroke','#B7B7B7');l.setAttribute('stroke-width','1.5');l.setAttribute('marker-end','url(#__UID__g)')});
 R.querySelectorAll('g[data-t] rect').forEach(r=>{r.setAttribute('stroke','#B7B7B7');r.setAttribute('stroke-width','1')});
 R.querySelectorAll('g[data-t] text').forEach(t=>t.setAttribute('fill','#607D8B'));
 R.querySelectorAll('g[data-v] rect').forEach(r=>r.setAttribute('fill','#CFD8DC'));
 R.querySelectorAll('g[data-v] text').forEach(t=>t.setAttribute('fill','#263238'));
 edges.forEach(e=>{const l=R.querySelector('line[data-e="'+e+'"]');if(!l)return;l.setAttribute('stroke','#0091EA');l.setAttribute('stroke-width','2.5');l.setAttribute('marker-end','url(#__UID__b)');
  const g=R.querySelector('g[data-t="'+e+'"]');g.querySelector('rect').setAttribute('stroke','#263238');g.querySelector('rect').setAttribute('stroke-width','1.5');g.querySelector('text').setAttribute('fill','#263238');});
 const paint=(v,c)=>{const g=R.querySelector('g[data-v="'+v+'"]');if(!g)return;g.querySelector('rect').setAttribute('fill',c);g.querySelector('text').setAttribute('fill','#FFFFFF');};
 reached.forEach(v=>paint(v,'#0091EA'));if(start)paint(start,'#0053A3');}
let I=2,S=1;
const nz=row=>row.map((v,j)=>v?j:-1).filter(j=>j>=0);
function paint(){
 $$('.c').forEach(c=>c.classList.remove('on','hot'));
 $$('button[data-i]').forEach(b=>b.classList.toggle('sel',+b.dataset.i===I));
 $$('button[data-s]').forEach(b=>b.classList.toggle('sel',+b.dataset.s===S));
 const os=nz(A[I]);
 os.forEach(o=>$('[data-a="'+I+'-'+o+'"]').classList.add(S===1?'hot':'on'));
 const ge=os.map(o=>String(A[I][o])),gv=os.map(o=>O[o]);
 if(S===2)os.forEach(o=>nz(B[o]).forEach(l=>{ge.push(String(B[o][l]));if(!gv.includes(L[l]))gv.push(L[l]);}));
 hl(ge,gv,C[I]);
 const out=$('.out');
 if(S===1){out.textContent='Hop 1: read row '+C[I]+' of HAS_VENDOR → '+os.map(o=>O[o]+' (edge '+A[I][o]+')').join(', ')+'. No index and no chain: the row is the neighbour list, and each cell is the key to that edge\u2019s properties.';return;}
 const res=[],parts=os.map(o=>{const ls=nz(B[o]);ls.forEach(l=>{$('[data-b="'+o+'-'+l+'"]').classList.add('hot');if(!res.includes(L[l]))res.push(L[l]);});
  return 'row '+O[o]+' → '+(ls.length?ls.map(l=>L[l]+' (edge '+B[o][l]+')').join(', '):'empty');});
 out.textContent='Hop 2: for each organisation found, read its row of ORG_HAS_LICENSE: '+parts.join('; ')+'. Licences reached: '+(res.length?res.join(', '):'none')+'.';}
R.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.i!==undefined){I=+b.dataset.i;paint();}else if(b.dataset.s){S=+b.dataset.s;paint();}});
paint();
})();
</script>
