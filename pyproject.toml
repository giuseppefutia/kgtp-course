[project]
name = "kgtp"
version = "0.1.0"
description = "Knowledge Graph Training Program — Chicago procurement labs"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "owlrl==7.6.2",
    "certifi==2025.8.3",
    "neo4j==5.28.2",
    "falkordb==1.7.1",
    "kuzu==0.11.3",
    "pyoxigraph==0.5.11",
    "networkx==3.5",
    "pyarrow==25.0.1",
    "falkordb-bulk-loader==1.2.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
]
# Rebuilding module 4's graph from the four CSVs and the extracted corpus. Not
# needed to run module 4: the module ships the finished graph as a dump, and
# `tools/04-building-the-graph/README.md` says what this buys you instead.
build = [
    # The importers read the CSVs with pandas and hand NaN back as None with
    # `replace({np.nan: None})`, which is why numpy is named rather than taken
    # for granted as a pandas dependency.
    "numpy==2.3.2",
    # The batch importer's progress bar. A load that prints nothing for two
    # minutes and a load that has hung look identical.
    "tqdm==4.67.1",
    # download.py against the data portal, and corpus/download_pdfs.py against
    # the document viewer.
    "requests==2.32.4",
    # Only the phases that ask a model: the typed extraction over the corpus and
    # the summariser. Imported inside the functions that use it, so the loaders
    # that read what a model already wrote run without it installed.
    "openai==3.14.0",
]

graphrag = [
    "langgraph==0.6.7",
    "langchain-core==0.3.78",
    "langchain-openai==0.3.35",
    "langchain-neo4j==0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
