[project]
name = "kgtp"
version = "0.1.0"
description = "Knowledge Graph Training Program — Chicago procurement labs"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "owlrl==7.6.2",
    "certifi==2025.8.3",
    "neo4j==5.28.2",
    "falkordb==1.7.1",
    "kuzu==0.11.3",
    "pyoxigraph==0.5.11",
    "networkx==3.5",
    "pyarrow==25.0.1",
    "falkordb-bulk-loader==1.2.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
]
# Rebuilding module 4's graph from the four CSVs and the extracted corpus. Not
# needed to run module 4: the module ships the finished graph as a dump, and
# `tools/04-building-the-graph/README.md` says what this buys you instead.
build = [
    # The importers read the CSVs with pandas and hand NaN back as None with
    # `replace({np.nan: None})`, which is why numpy is named rather than taken
    # for granted as a pandas dependency.
    "numpy==2.3.2",
    # The batch importer's progress bar. A load that prints nothing for two
    # minutes and a load that has hung look identical.
    "tqdm==4.67.1",
    # download.py against the data portal, and corpus/download_pdfs.py against
    # the document viewer.
    "requests==2.32.4",
    # Only the phases that ask a model: the typed extraction over the corpus and
    # the summariser. Imported inside the functions that use it, so the loaders
    # that read what a model already wrote run without it installed.
    "openai==3.14.0",
]

graphrag = [
    "langgraph==0.6.7",
    "langchain-core==0.3.78",
    "langchain-openai==0.3.35",
    "langchain-neo4j==0.5.0",
    # Named rather than taken for granted as a langchain dependency.
    # `pipelines/react.py` and `pipelines/search.py` -- code a student runs --
    # do `from openai import OpenAI` directly, while langchain-openai only asks
    # for `openai<3.0.0,>=1.104.2`. Unpinned, the agent's client moves whenever
    # that range resolves differently, which is the runtime-resolved component
    # CLAUDE.md names as the worst case. The `build`/`instructor` extra pins
    # 3.14.0 for the summariser: the two cannot be installed together, and the
    # error says so at install time instead of in the room.
    "openai==2.54.0",
]

# Module 6's memory layer. The three memory types the module builds -- the
# conversation, the entities a turn touched, the trace of its tool calls -- are
# this library's three layers, so the module records them with it rather than
# rewriting a store. Four dependencies, and three of them are already here.
#
# Pinned to 0.8.0 for the reason every pin here exists, with one extra reason:
# the library is pre-1.0 with fifteen releases behind it, and its own FAQ
# documents a breaking change before 0.2.1. Every claim module 6 makes about it
# is a claim about this version.
#
# Measured 11/11/2026: installed into the pinned stack above it leaves
# `neo4j` at 5.28.2. Installed on its own into an empty environment it resolves
# `neo4j` to 6.4.1, because it declares `>=5.20,<7` -- so it goes in with the
# rest, never alone.
agent-memory = [
    "neo4j-agent-memory==0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
