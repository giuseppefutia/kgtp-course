[project]
name = "kgtp"
version = "0.1.0"
description = "Knowledge Graph Training Program — Chicago procurement labs"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "owlrl==7.6.2",
    "certifi==2025.8.3",
    "neo4j==5.28.2",
    "falkordb==1.7.1",
    "kuzu==0.11.3",
    "pyoxigraph==0.5.11",
    "networkx==3.5",
    "pyarrow==25.0.1",
    "falkordb-bulk-loader==1.2.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
]
graphrag = [
    "langgraph==0.6.7",
    "langchain-core==0.3.78",
    "langchain-openai==0.3.35",
    "langchain-neo4j==0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
